services:
  # ─── BACKEND (FastAPI) ───────────────────────────────────────────
  - type: web
    name: varshanet-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DEFAULT_OPERATING_MODE
        value: LIVE_DATA
      - key: LOG_LEVEL
        value: info
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TOMORROW_API_KEY
        sync: false
      - key: IMD_API_KEY
        sync: false
      - key: MOSDAC_USERNAME
        sync: false
      - key: MOSDAC_PASSWORD
        sync: false

  # ─── FRONTEND (React + Vite static) ─────────────────────────────
  - type: web
    name: varshanet-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sih86.onrender.com
      - key: VITE_MAPBOX_TOKEN
        sync: false
