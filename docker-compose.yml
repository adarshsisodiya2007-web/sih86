version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: varshanet-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SIMULATION_MODE=true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: varshanet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
